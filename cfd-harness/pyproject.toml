[project]
name = "cavity-harness"
version = "0.1.0"
description = "Agent harness for the OpenFOAM lid-driven cavity tutorial"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40"]

[project.scripts]
harness = "harness.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "harness"
