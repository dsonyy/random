[project]
name = "entity-chat"
version = "0.1.0"
description = "Ask questions about named entities found in a PDF"
authors = [
    { name = "Szymon Bednorz", email = "dsonyyy@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "glinker==0.1.1",
    "kreuzberg==4.10.2",
    "pydantic-ai-slim[anthropic]==2.37.0",
    "torch==2.14.0",
]

[project.scripts]
entity-chat = "entity_chat:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
